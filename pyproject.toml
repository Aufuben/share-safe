[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "share-safe"
version = "0.1.0"
description = "Strip GPS and identifying metadata from images and PDFs before sharing. Local-only, originals never overwritten."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "share-safe contributors" }]
keywords = ["privacy", "exif", "gps", "metadata", "cli", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "pillow>=10.0.0",
    "piexif>=1.1.3",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16.0"]
dev = ["pytest>=8.0"]

[project.scripts]
share-safe = "share_safe.cli:main"

[project.urls]
Homepage = "https://github.com/Aufuben/share-safe"
Issues = "https://github.com/Aufuben/share-safe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
